name: Publish release assets (one-off)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (desktop-v...)
        required: true
      run_id:
        description: Workflow run holding installer artifacts
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.PACK_BUMP_PAT }}
          path: release-assets
          merge-multiple: true
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ secrets.PACK_BUMP_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          version="${tag#desktop-v}"
          notes="doc/releases/$version.md"
          test -f "$notes"
          printf '\n> ⚠️ 未签名内测构建：签名凭据未配置。macOS 首次打开需在「系统设置 → 隐私与安全性」选择「仍要打开」；Windows SmartScreen 需选择「仍要运行」。本版无应用内自动更新。\n' >> "$notes"
          gh release create "$tag" --prerelease --title "Industrial Agent Harness $version (unsigned internal build)" --notes-file "$notes"
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 -r gh release upload "$tag" --clobber
