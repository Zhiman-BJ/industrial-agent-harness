name: Harness CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full acceptance: 20:00 UTC is 04:00 Beijing, so the complete
    # matrices are finished before the next working day starts.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run full native, installation and upgrade acceptance'
        type: boolean
        default: false

permissions:
  contents: read
  # Listing pull-request files for area gating needs this on a private
  # repository; the token is still read-only.
  pull-requests: read

concurrency:
  group: harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Core PR checks retain four native Portable platforms, packaged Desktop
  # startup and a real Linux engineering path. The full acceptance matrices
  # run nightly, on manual full runs and on PRs that bump the pinned Domain
  # Pack lockfile; plain main merges repeat the core path their PRs already
  # ran. See ADR-008.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.areas.outputs.core }}
      full: ${{ steps.areas.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changed files
        id: areas
        uses: actions/github-script@v7
        with:
          script: |
            const { plan } = require('./scripts/ci-areas.cjs');
            const entries = [];
            if (context.eventName === 'pull_request') {
              for (let page = 1; page <= 30; page += 1) {
                const chunk = await github.rest.pulls.listFiles({
                  ...context.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                  page,
                });
                entries.push(...chunk.data.map(entry => ({
                  filename: entry.filename,
                  previous_filename: entry.previous_filename,
                })));
                if (chunk.data.length < 100) break;
              }
            }
            core.info(`Changed files (${entries.length}):\n${entries.map(entry => entry.filename).join('\n')}`);
            const selected = plan(entries, {
              eventName: context.eventName,
              // An incomplete file listing must never select the docs-only path.
              full: entries.length >= 3000 || [true, 'true'].includes(context.payload.inputs?.full),
            });
            for (const [name, enabled] of Object.entries(selected)) {
              core.setOutput(name, String(enabled));
            }

  repository:
    uses: ./.github/workflows/structure.yml

  portable:
    name: Portable (${{ matrix.platform }}-${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    env:
      HARNESS_CI_PLATFORM: ${{ matrix.platform }}
      HARNESS_CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      # Owner packs that declare a platform probe need a trusted committed
      # build for distribution assembly. The probe script is absent while the
      # pinned owner ships none; build it into the default index location the
      # distribution builder auto-detects when the owner starts declaring one.
      - uses: actions/setup-go@v5
        if: runner.os == 'macOS'
        with:
          go-version: '1.26.2'
          cache: false
      - name: Build the platform probe when the owner ships one
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -f scripts/build-platform-probe.cjs ]; then
            node scripts/build-platform-probe.cjs
          fi
      - name: Expose Git for Windows unzip for archive fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'
      - name: Shared packages, CLI, SDK and platform boundaries
        shell: bash
        run: |
          mkdir -p dist/ci-reports
          pnpm run test:ci -- portable 2>&1 | tee dist/ci-reports/portable.log
      - name: Verify independent packaged CLI consumers
        shell: bash
        run: |
          pnpm run smoke:ci-packages 2>&1 | tee dist/ci-reports/packages.log
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/ci-reports/
          if-no-files-found: warn
          retention-days: 14

  desktop:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/desktop-package.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}

  industrial:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/industrial-core.yml
    with:
      # Nightly and manual full runs keep both macOS versions; pin-bump PRs
      # stay on macos-15 for faster pre-merge feedback.
      extended: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  industrial-linux:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/industrial-linux.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}

  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [changes, repository, portable, desktop, industrial, industrial-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REQUIRED_JOBS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Require every scheduled regression layer to succeed
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.REQUIRED_JOBS);
          for (const [name, job] of Object.entries(jobs)) {
            console.log(`${name}: ${job.result}`);
          }
          const failed = require('./scripts/ci-areas.cjs').failedJobs(jobs);
          if (failed.length > 0) {
            console.error(`Required CI layers did not pass: ${failed.join(', ')}`);
            process.exit(1);
          }
          NODE
