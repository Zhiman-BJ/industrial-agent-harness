name: Harness CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Area gating: documentation-only pull requests keep only the repository
  # structure layer, and pull requests confined to apps/desktop skip the
  # shared-package Portable matrix and the Linux chip installer acceptance
  # (neither layer ships Desktop UI code). Pushes to main and manual
  # dispatches always run every layer, so merged code keeps the full net.
  # The classification rules live in scripts/ci-areas.cjs and are unit-tested
  # by the portable suite, so this job checks out the repository to require
  # the shared module.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.areas.outputs.docs_only }}
      shared_changed: ${{ steps.areas.outputs.shared_changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changed files
        id: areas
        uses: actions/github-script@v7
        with:
          script: |
            const { classify } = require('./scripts/ci-areas.cjs');
            if (context.eventName !== 'pull_request') {
              core.setOutput('docs_only', 'false');
              core.setOutput('shared_changed', 'true');
              return;
            }
            const entries = [];
            for (let page = 1; page <= 30; page += 1) {
              const chunk = await github.rest.pulls.listFiles({
                ...context.repo,
                pull_number: context.issue.number,
                per_page: 100,
                page,
              });
              entries.push(...chunk.data.map(entry => ({
                filename: entry.filename,
                previous_filename: entry.previous_filename,
              })));
              if (chunk.data.length < 100) break;
            }
            if (entries.length >= 3000) {
              // Too many files to classify reliably; run every layer.
              core.setOutput('docs_only', 'false');
              core.setOutput('shared_changed', 'true');
              return;
            }
            core.info(`Changed files (${entries.length}):\n${entries.map(entry => entry.filename).join('\n')}`);
            const { docsOnly, sharedChanged } = classify(entries);
            core.setOutput('docs_only', String(docsOnly));
            core.setOutput('shared_changed', String(sharedChanged));

  repository:
    uses: ./.github/workflows/structure.yml

  portable:
    name: Portable (${{ matrix.platform }}-${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.shared_changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    env:
      HARNESS_CI_PLATFORM: ${{ matrix.platform }}
      HARNESS_CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Expose Git for Windows unzip for archive fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'
      - name: Shared packages, CLI, SDK and platform boundaries
        shell: bash
        run: |
          mkdir -p dist/ci-reports
          pnpm run test:ci -- portable 2>&1 | tee dist/ci-reports/portable.log
      - name: Verify independent packaged CLI consumers
        shell: bash
        run: |
          pnpm run smoke:ci-packages 2>&1 | tee dist/ci-reports/packages.log
      - name: Retain regression evidence
        if: always()
        continue-on-error: true  # storage-quota failures must not fail test verdicts
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/ci-reports/
          if-no-files-found: warn
          retention-days: 14

  desktop:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    uses: ./.github/workflows/desktop-package.yml

  industrial:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    uses: ./.github/workflows/industrial-core.yml

  industrial-linux:
    needs: changes
    if: needs.changes.outputs.shared_changed == 'true'
    uses: ./.github/workflows/industrial-linux.yml

  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [changes, repository, portable, desktop, industrial, industrial-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REQUIRED_JOBS: ${{ toJSON(needs) }}
    steps:
      - name: Require every scheduled regression layer to succeed
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.REQUIRED_JOBS);
          for (const [name, job] of Object.entries(jobs)) {
            console.log(`${name}: ${job.result}`);
          }
          // Gated layers may be skipped by design; anything that actually ran
          // must pass, and the area detection itself must never fail silently.
          const failed = Object.entries(jobs).filter(
            ([name, job]) => job.result !== 'success' && !(job.result === 'skipped' && name !== 'changes'),
          );
          if (failed.length > 0) {
            process.exit(1);
          }
          NODE
