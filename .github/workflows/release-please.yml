name: Release please

# Maintains the desktop Release PR: conventional commits (feat/fix) on main
# accumulate into a single "chore(release): prepare desktop <version>" pull
# request that bumps apps/desktop/package.json and apps/desktop/CHANGELOG.md.
# Merging that PR creates the desktop-v<version> tag and the GitHub Release,
# which triggers release-desktop.yml to build and upload the installers.
# The PAT is required so the robot's release PRs and tags actually trigger CI
# and release-desktop.yml; events created by the default job token do not.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PACK_BUMP_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
