name: Release headless harness

on:
  push:
    tags:
      - 'headless-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require version-specific integration notes
        run: |
          notes="releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          grep -q '^## 相比原生 Kimi Code 集成了什么' "$notes"
          grep -q '^## 尚未集成' "$notes"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install -g pnpm@11.1.3
          pnpm install --frozen-lockfile
      - name: Prepare declared local task isolation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - name: Verify headless code and boundaries
        run: |
          pnpm test:architecture
          pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare pinned MCP runtimes (Kimi Code is bundled)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.11.6
          cd "$(node scripts/pack-source.cjs chip-pack)/eda-harness"
          uv sync --frozen --no-dev --python 3.13
          uv run --frozen python -m pytest -q
          cd ../../pcb
          uv sync --frozen --no-dev --python 3.13
      - name: Verify actual scoped MCP and approval behavior
        run: |
          pnpm test:mcp
          pnpm test:external-mcp
      - name: Package and smoke test extracted asset
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-headless.cjs
          for domain in chip pcb godot cad; do
            node scripts/package-headless.cjs --domain "$domain"
          done
          node -e 'for (const name of ["headless", "headless-chip", "headless-pcb", "headless-godot", "headless-cad"]) { const p = require(`./dist/${name}/HARNESS-PACKAGE.json`); if (p.sourceDirty !== false || p.sourceCommit !== process.env.GITHUB_SHA) throw Error(`Invalid release source: ${name}`); }'
          mkdir -p release /tmp/industrial-headless-release-smoke
          asset="industrial-agent-harness-headless-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "release/$asset" -C dist headless
          for domain in chip pcb godot cad; do
            tar -czf "release/industrial-agent-harness-cli-${domain}-${GITHUB_REF_NAME}.tar.gz" -C dist "headless-$domain"
            tar -xzf "release/industrial-agent-harness-cli-${domain}-${GITHUB_REF_NAME}.tar.gz" -C /tmp/industrial-headless-release-smoke
          done
          node scripts/smoke-domain-cli.cjs /tmp/industrial-headless-release-smoke
          (
            cd /tmp/industrial-headless-release-smoke/headless-chip/domain-packs/chip/eda-harness
            uv sync --frozen --no-dev --python 3.13
          )
          INDUSTRIAL_HARNESS_TEST_CLI=/tmp/industrial-headless-release-smoke/headless-chip/industrial-harness.cjs \
          INDUSTRIAL_HARNESS_CHIP_PACK_DIR=/tmp/industrial-headless-release-smoke/headless-chip/domain-packs/chip \
          INDUSTRIAL_HARNESS_EDA_PYTHON=/tmp/industrial-headless-release-smoke/headless-chip/domain-packs/chip/eda-harness/.venv/bin/python \
            node --test tests/integration/domain-mcp-kimi.test.cjs tests/integration/domain-mcp-scope.test.cjs tests/integration/chip-runtime-reliability.test.cjs
          INDUSTRIAL_HARNESS_TEST_CLI=/tmp/industrial-headless-release-smoke/headless-chip/industrial-harness.cjs \
            node --test tests/integration/external-mcp-kimi.test.cjs
          for domain in chip pcb; do
            node scripts/smoke-workspace-cli.cjs "/tmp/industrial-headless-release-smoke/headless-$domain/industrial-harness.cjs" "$domain" "release/workspace-$domain-verification.json"
          done
          tar -xzf "release/$asset" -C /tmp/industrial-headless-release-smoke
          (
            cd /tmp/industrial-headless-release-smoke
            node headless/industrial-harness.cjs bench \
              --suite "$GITHUB_WORKSPACE/examples/bench/scope-smoke.json" \
              --output-dir "$RUNNER_TEMP/headless-bench-results"
          )
          (
            cd release
            for archive in *.tar.gz; do
              sha256sum "$archive" > "$archive.sha256"
            done
          )
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --prerelease \
            --title "Industrial Agent Harness headless $GITHUB_REF_NAME" \
            --notes-file "releases/${GITHUB_REF_NAME}.md"
