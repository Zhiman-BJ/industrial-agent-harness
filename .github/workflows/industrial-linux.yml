name: Linux Chip installer acceptance

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: chip-linux-installer-v0.1.0-preview.5

permissions:
  contents: read

jobs:
  native-installed-chip:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The Verilator build takes several minutes from source; its version and
      # pinned tarball SHA live in this workflow file, which keys the cache.
      # The previous-preview installer is pinned the same way. The chip pack
      # tarball is pinned by pnpm-lock.yaml, keying its uv environment.
      - name: Restore compiled Verilator runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/verilator-runtime
          key: verilator-5.026-${{ runner.os }}-${{ hashFiles('.github/workflows/industrial-linux.yml') }}
      - name: Restore previous chip preview installer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/prior-assets
          key: chip-prior-installer-${{ runner.os }}-${{ hashFiles('.github/workflows/industrial-linux.yml') }}
      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve chip Domain Pack source
        id: packs
        run: echo "chip=$(node scripts/pack-source.cjs chip-pack)" >> "$GITHUB_OUTPUT"
      - name: Restore chip EDA uv environment
        uses: actions/cache@v4
        with:
          path: ${{ steps.packs.outputs.chip }}/eda-harness/.venv
          key: chip-eda-venv-${{ runner.os }}-py3.13-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Prepare protected Linux and engineering runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep curl autoconf flex bison help2man libfl-dev g++ make
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev -- /bin/true
          if [ ! -x "$RUNNER_TEMP/verilator-runtime/bin/verilator" ]; then
            curl -fL --retry 3 https://github.com/verilator/verilator/archive/refs/tags/v5.026.tar.gz -o "$RUNNER_TEMP/verilator.tar.gz"
            printf '87fdecf3967007d9ee8c30191ff2476f2a33635d0e0c6e3dbf345cc2f0c50b78  %s\n' "$RUNNER_TEMP/verilator.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/verilator.tar.gz" -C "$RUNNER_TEMP"
            (
              cd "$RUNNER_TEMP/verilator-5.026"
              autoconf
              ./configure --prefix="$RUNNER_TEMP/verilator-runtime"
              make -j2
              make install
            ) > "$RUNNER_TEMP/verilator-build.log" 2>&1
          else
            echo "Using restored Verilator runtime from cache."
          fi
          export PATH="$RUNNER_TEMP/verilator-runtime/bin:$PATH"
          printf '%s\n' "$RUNNER_TEMP/verilator-runtime/bin" >> "$GITHUB_PATH"
          verilator --version
          python -m pip install uv==0.11.6
          node apps/desktop/scripts/setup-kimi.cjs
          cd "$(node scripts/pack-source.cjs chip-pack)/eda-harness"
          uv sync --frozen --no-dev --python 3.13
      - name: Install the previous public preview before upgrading
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior-assets"
          cd "$RUNNER_TEMP/prior-assets"
          if [ ! -f industrial-harness-chip-linux-install.run ]; then
            old_url='https://github.com/Zhiman-BJ/industrial-agent-harness/releases/download/chip-linux-installer-v0.1.0-preview.4'
            curl -fL --retry 3 "$old_url/industrial-harness-chip-linux-install.run" -o industrial-harness-chip-linux-install.run
            curl -fL --retry 3 "$old_url/industrial-harness-chip-linux-install.run.sha256" -o industrial-harness-chip-linux-install.run.sha256
          else
            echo "Using restored previous chip preview installer from cache."
          fi
          sha256sum -c industrial-harness-chip-linux-install.run.sha256
          bash industrial-harness-chip-linux-install.run --skip-image --prefix "$RUNNER_TEMP/prior chip" --bin-dir "$RUNNER_TEMP/chip-bin"
      - name: Native Agent, project discovery, real RTL and recovery
        shell: bash
        run: |
          set -euo pipefail
          export KIMI_EXECUTABLE="$(node -p "require('./packages/agent-kimi/src/code-session.cjs').bundledExecutable()")"
          pnpm run test:ci -- native-linux
          node --test tests/integration/linux-chip-bootstrap.test.cjs
      - name: Verify packaged headless Agent through its production process boundary
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/integration/headless-package-kimi.test.cjs 2>&1 | tee dist/ci-reports/headless-native.log
      - name: Build clean immutable installer and verify actual installed consumer
        shell: bash
        run: |
          set -euo pipefail
          test -f "releases/$RELEASE_TAG.md"
          node scripts/package-headless.cjs --domain chip
          mkdir -p dist/linux-chip-release
          tar -czf dist/chip-cli.tar.gz -C dist headless-chip
          node scripts/package-linux-chip-installer.cjs dist/chip-cli.tar.gz dist/linux-chip-release/industrial-harness-chip-linux-install.run "$RELEASE_TAG" > dist/linux-chip-release/build-identity.json
          node scripts/smoke-cli-upgrade.cjs "$RUNNER_TEMP/prior chip" "$PWD/dist/linux-chip-release/industrial-harness-chip-linux-install.run" "$RUNNER_TEMP/installed chip" "$RUNNER_TEMP/chip-bin" "$RUNNER_TEMP/upgrade-user" dist/linux-chip-release/upgrade-verification.json
          node scripts/smoke-linux-chip-install.cjs "$RUNNER_TEMP/installed chip" "$RUNNER_TEMP/chip-bin/industrial-harness-chip" dist/linux-chip-release/verification.json
          node scripts/smoke-workspace-cli.cjs "$RUNNER_TEMP/chip-bin/industrial-harness-chip" chip dist/linux-chip-release/workspace-verification.json
          KIMI_EXECUTABLE="" INDUSTRIAL_HARNESS_TEST_CLI="$RUNNER_TEMP/installed chip/cli/industrial-harness.cjs" node --test tests/integration/external-mcp-kimi.test.cjs
          bash dist/linux-chip-release/industrial-harness-chip-linux-install.run --skip-image --prefix "$RUNNER_TEMP/installed chip" --bin-dir "$RUNNER_TEMP/chip-bin"
          cp "$RUNNER_TEMP/installed chip/install-receipt.json" dist/linux-chip-release/install-receipt.json
      - name: Verify installed host Docker execution alongside the protected Agent
        shell: bash
        run: |
          set -euo pipefail
          docker info
          mkdir -p "$RUNNER_TEMP/docker-rtl-context"
          cp -a "$RUNNER_TEMP/verilator-runtime" "$RUNNER_TEMP/docker-rtl-context/verilator"
          cat > "$RUNNER_TEMP/docker-rtl-context/Dockerfile" <<'DOCKER'
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y --no-install-recommends g++ make perl python3 ccache ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY verilator /opt/verilator
          RUN sed -i 's|^PYTHON3 = .*|PYTHON3 = /usr/bin/python3|' /opt/verilator/share/verilator/include/verilated.mk
          ENV PATH="/opt/verilator/bin:${PATH}"
          ENV CCACHE_DISABLE=1
          DOCKER
          image="industrial-harness-ci-verilator:${GITHUB_SHA}"
          docker build -t "$image" "$RUNNER_TEMP/docker-rtl-context" > "$RUNNER_TEMP/docker-rtl-build.log" 2>&1
          docker run --rm "$image" verilator --version
          HARNESS_WORKSPACE_DOCKER_IMAGE="$image" node --test tests/integration/workspace-docker.test.cjs
          node - "$RUNNER_TEMP/installed chip/install-receipt.json" "$image" <<'JS'
          const fs = require('node:fs');
          const [file, image] = process.argv.slice(2);
          const receipt = JSON.parse(fs.readFileSync(file));
          receipt.image = image;
          fs.writeFileSync(file, JSON.stringify(receipt, null, 2) + '\n');
          JS
          node scripts/smoke-linux-chip-install.cjs "$RUNNER_TEMP/installed chip" "$RUNNER_TEMP/chip-bin/industrial-harness-chip" dist/linux-chip-release/docker-runtime-verification.json
          docker image inspect "$image" --format '{{.Id}}' > dist/linux-chip-release/docker-test-image-id.txt
          docker image rm "$image"
      - name: Retain installer and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-chip-installer
          path: |
            dist/linux-chip-release/
            dist/ci-reports/
          if-no-files-found: warn
          retention-days: 14
