name: Industrial Core acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-vertical-slice:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      HARNESS_REQUIRE_CORE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve chip Domain Pack source
        id: packs
        run: echo "chip=$(node scripts/pack-source.cjs chip-pack)" >> "$GITHUB_OUTPUT"
      # The pack tarball is pinned by pnpm-lock.yaml, so the lock hash keys the
      # uv environment; uv sync then reconciles incrementally. FreeCAD and the
      # Pack native archives re-verify their pinned SHA-256 on every run, so a
      # restored cache cannot bypass integrity checks.
      - name: Restore chip EDA uv environment
        uses: actions/cache@v4
        with:
          path: ${{ steps.packs.outputs.chip }}/eda-harness/.venv
          key: chip-eda-venv-${{ runner.os }}-py3.13-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore pinned FreeCAD runtime image
        uses: actions/cache@v4
        with:
          # Only the verified image, not the workspace dir: the setup script
          # keeps its read-only disk mount inside it during the job.
          path: dist/freecad-runtime/*.dmg
          key: freecad-runtime-${{ runner.os }}-${{ hashFiles('scripts/setup-freecad.cjs') }}
      - name: Restore Pack native runtime archives
        uses: actions/cache@v4
        with:
          path: |
            dist/pcb-runtime/*.dmg
            dist/godot-runtime/*.zip
          key: pack-native-archives-v2-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Prepare native engineering and agent runtimes
        run: |
          python -m pip install uv==0.11.6
          brew install verilator ripgrep
          node apps/desktop/scripts/setup-kimi.cjs
          cd "$(node scripts/pack-source.cjs chip-pack)/eda-harness"
          uv sync --frozen --no-dev --python 3.13
      - name: Verify Desktop conversations, controls, documents and native subagents
        shell: bash
        run: |
          mkdir -p dist/ci-reports
          pnpm --filter @industrial-agent-harness/desktop build
          for suite in chats logs mcp subagents kicad engineering ui language documents images parallel model-sync; do
            pnpm --filter @industrial-agent-harness/desktop "test:$suite" 2>&1 | tee "dist/ci-reports/desktop-$suite.log"
          done
      - name: Prepare pinned official FreeCAD runtime
        run: node scripts/setup-freecad.cjs
      - name: Prepare owner-pinned public professional runtimes
        run: |
          for pack in pcb godot; do
            node "$(node scripts/pack-source.cjs "$pack-pack")/runtime/setup-native.cjs" "$GITHUB_WORKSPACE/dist/$pack-runtime"
          done
      - name: Verify prepared archive cache identities
        run: node scripts/prepare-ci-runtime-archives.cjs
      - name: Build independent CAD CLI for native execution
        run: node scripts/package-headless.cjs dist/freecad-cli --domain cad
      - name: Verify common workspace and MCP in packaged CLIs
        shell: bash
        run: |
          unset KIMI_EXECUTABLE
          for domain in chip pcb godot; do
            node scripts/package-headless.cjs "dist/workspace-$domain" --domain "$domain"
            node scripts/smoke-workspace-cli.cjs "$GITHUB_WORKSPACE/dist/workspace-$domain/industrial-harness.cjs" "$domain" "dist/ci-reports/workspace-$domain.json"
          done
          INDUSTRIAL_HARNESS_TEST_CLI="$GITHUB_WORKSPACE/dist/workspace-chip/industrial-harness.cjs" node --test tests/integration/external-mcp-kimi.test.cjs
      - name: Verify the real state, action, verification and recovery path
        shell: bash
        run: |
          export KIMI_EXECUTABLE="$(node -p "require('./packages/agent-kimi/src/code-session.cjs').bundledExecutable()")"
          export HARNESS_FREECAD_TEST_CLI="$GITHUB_WORKSPACE/dist/freecad-cli/industrial-harness.cjs"
          export HARNESS_PROFESSIONAL_EVIDENCE="$RUNNER_TEMP/professional-evidence"
          mkdir -p "$HARNESS_PROFESSIONAL_EVIDENCE"
          pnpm run test:ci -- native 2>&1 | tee dist/ci-reports/native.log
      - name: Verify packaged headless Agent through its production process boundary
        shell: bash
        run: node --test tests/integration/headless-package-kimi.test.cjs 2>&1 | tee dist/ci-reports/headless-native.log
      - name: Verify real FreeCAD artifacts through the Desktop viewer
        shell: bash
        run: |
          export HARNESS_CAD_SELFTEST_OUTPUT="$GITHUB_WORKSPACE/dist/ci-reports/cad-viewer.png"
          pnpm --filter @industrial-agent-harness/desktop test:cad-resize 2>&1 | tee dist/ci-reports/cad-viewer.log
      - name: Verify external MCP through the real Desktop settings and approval flow
        shell: bash
        run: |
          export KIMI_EXECUTABLE="$(node -p "require('./packages/agent-kimi/src/code-session.cjs').bundledExecutable()")"
          pnpm --filter @industrial-agent-harness/desktop test:external-mcp 2>&1 | tee dist/ci-reports/external-mcp-desktop.log
      - name: Collect native FreeCAD startup diagnostics
        if: failure()
        run: |
          mkdir -p dist/ci-reports
          sw_vers > dist/ci-reports/macos.txt
          codesign --verify --strict --verbose=2 "$INDUSTRIAL_HARNESS_FREECAD_CMD" > dist/ci-reports/freecad-signature.txt 2>&1 || true
          log show --last 5m --style compact --predicate 'process == "amfid" OR process == "freecadcmd"' > dist/ci-reports/freecad-system.log 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -iname '*freecad*' -exec cp {} dist/ci-reports/ \; || true
      - name: Collect installed professional task evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/professional-evidence" ]; then
            mkdir -p dist/ci-reports
            node scripts/collect-native-evidence.cjs "$RUNNER_TEMP/professional-evidence" dist/ci-reports/professional
          fi
      - name: Retain native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-native-arm64-${{ matrix.os }}
          path: dist/ci-reports/
          if-no-files-found: warn
          retention-days: 14

  native-installed:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      HARNESS_REQUIRE_CORE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare agent runtime
        run: |
          brew install ripgrep
          node apps/desktop/scripts/setup-kimi.cjs
      - name: Restore pinned FreeCAD runtime image
        uses: actions/cache@v4
        with:
          path: dist/freecad-runtime/*.dmg
          key: freecad-runtime-${{ runner.os }}-${{ hashFiles('scripts/setup-freecad.cjs') }}
      - name: Restore Pack native runtime archives
        uses: actions/cache@v4
        with:
          path: |
            dist/pcb-runtime/*.dmg
            dist/godot-runtime/*.zip
          key: pack-native-archives-v2-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Prepare verified official archive cache without installing apps
        run: node scripts/prepare-ci-runtime-archives.cjs --download
      - name: Stage independent production payloads for professional tasks
        run: |
          pnpm --filter @industrial-agent-harness/desktop build
          node scripts/package-headless.cjs dist/professional-cli
          HARNESS_BOOTSTRAP_DOMAINS='' node scripts/stage-desktop.cjs dist/professional-desktop
      - name: Verify fresh managed installations and real packaged engineering tasks
        shell: bash
        run: |
          export KIMI_EXECUTABLE="$(node -p "require('./packages/agent-kimi/src/code-session.cjs').bundledExecutable()")"
          export HARNESS_PROFESSIONAL_TEST_CLI="$GITHUB_WORKSPACE/dist/professional-cli/industrial-harness.cjs"
          export HARNESS_PROFESSIONAL_DESKTOP_ENTRY="$GITHUB_WORKSPACE/dist/professional-desktop/electron/main.cjs"
          export HARNESS_PROFESSIONAL_EVIDENCE="$RUNNER_TEMP/professional-evidence"
          mkdir -p "$HARNESS_PROFESSIONAL_EVIDENCE" dist/ci-reports
          pnpm run test:ci -- native-installed 2>&1 | tee dist/ci-reports/native-installed.log
      - name: Collect installed professional task evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/professional-evidence" ]; then
            mkdir -p dist/ci-reports
            node scripts/collect-native-evidence.cjs "$RUNNER_TEMP/professional-evidence" dist/ci-reports/professional
          fi
      - name: Retain native installation regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-native-installed-arm64-${{ matrix.os }}
          path: dist/ci-reports/
          if-no-files-found: warn
          retention-days: 14

  native-acceptance:
    name: All native acceptance lanes passed
    if: always()
    needs: [native-vertical-slice, native-installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REQUIRED_NATIVE_JOBS: ${{ toJSON(needs) }}
    steps:
      - name: Require both native matrices to succeed
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.REQUIRED_NATIVE_JOBS);
          for (const name of ['native-vertical-slice', 'native-installed']) {
            console.log(`${name}: ${jobs[name]?.result}`);
            if (jobs[name]?.result !== 'success') process.exitCode = 1;
          }
          NODE
