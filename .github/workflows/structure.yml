name: Repository structure

on:
  workflow_call:

jobs:
  structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check scaffold
        run: |
          test -f README.md
          test -f README.zh-CN.md
          test -f AGENTS.md
          test -f pnpm-workspace.yaml
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          for dir in apps/desktop packages/agent-kimi packages/contracts packages/domain-skills packages/domain-runtime packages/domain-mcp packages/pack-manager packages/viewer-core packages/viewer-builtin; do
            test -f "$dir/README.md"
            test -f "$dir/package.json"
          done
          test -f apps/desktop/viewer-host/README.md
          test -f doc/viewer-layer.md
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Source formatting
        run: pnpm run format:check
      - name: Architecture boundaries
        run: pnpm test:architecture
      - name: Domain Pack release contents and compatibility
        run: pnpm run test:release
      - name: Prepare independent RTL benchmark verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Paired benchmark engineering smoke
        run: pnpm run test:ci -- benchmark
      - name: Build Desktop renderer
        run: pnpm --filter @industrial-agent-harness/desktop build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve Domain Pack sources
        id: packs
        run: |
          echo "chip=$(node scripts/pack-source.cjs chip-pack)" >> "$GITHUB_OUTPUT"
          echo "pcb=$(node scripts/pack-source.cjs pcb-pack)" >> "$GITHUB_OUTPUT"
      # Pack tarballs are pinned by pnpm-lock.yaml, so the lock hash keys the
      # uv environments; uv sync reconciles incrementally after a restore.
      - name: Restore Domain Pack uv environments
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.packs.outputs.chip }}/eda-harness/.venv
            ${{ steps.packs.outputs.pcb }}/.venv
          key: pack-uv-venvs-${{ runner.os }}-py3.13-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Verify registered Domain MCP over real transport
        run: |
          python -m pip install uv==0.11.6
          PACK_CHIP_SOURCE="$(node scripts/pack-source.cjs chip-pack)/eda-harness"
          PACK_PCB_SOURCE="$(node scripts/pack-source.cjs pcb-pack)"
          uv sync --frozen --no-dev --python 3.13 --directory "$PACK_CHIP_SOURCE"
          uv run --frozen --directory "$PACK_CHIP_SOURCE" python -m pytest -q
          uv sync --frozen --no-dev --python 3.13 --directory "$PACK_PCB_SOURCE"
          pnpm run test:ci -- transport
      - name: Retain verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-regression
          path: dist/ci-reports/
          if-no-files-found: warn
          retention-days: 14
