name: Repository structure

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scaffold
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f pnpm-workspace.yaml
          for dir in apps/desktop packages/agent-kimi packages/contracts packages/domain-skills packages/domain-runtime packages/domain-mcp packages/viewer-core packages/viewer-builtin; do
            test -f "$dir/README.md"
            test -f "$dir/package.json"
          done
          test -f apps/desktop/viewer-host/README.md
          test -f doc/viewer-layer.md
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install -g pnpm@11.1.3
          pnpm install --frozen-lockfile
      - name: Architecture boundaries
        run: pnpm test:architecture
      - name: Build and test MVP
        run: |
          pnpm build
          pnpm test
      - name: Industrial Core vertical slice gate when implemented
        run: |
          if test -f tests/integration/domain-mcp-scope.test.cjs; then
            node --test tests/integration/domain-mcp-scope.test.cjs
          fi
          if test -f tests/integration/industrial-core-vertical-slice.test.cjs; then
            node --test tests/integration/industrial-core-vertical-slice.test.cjs
          fi
