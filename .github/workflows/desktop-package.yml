name: Desktop install smoke

on:
  workflow_call:

jobs:
  packaged-first-run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
          - runner: windows-2025
            platform: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Restore Electron build downloads (macOS)
        if: matrix.platform == 'mac'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore Electron build downloads (Windows)
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Build Desktop and stage installable application
        shell: bash
        run: |
          pnpm --filter @industrial-agent-harness/desktop build
          node scripts/stage-desktop.cjs dist/desktop-stage-ci
      - name: Verify guided installation experience
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          mkdir -p dist/ci-reports
          node apps/desktop/scripts/test-install-experience.cjs 2>&1 | tee dist/ci-reports/install-experience.log
      - name: Package macOS application
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          ./apps/desktop/node_modules/.bin/electron-builder --projectDir dist/desktop-stage-ci --config "$GITHUB_WORKSPACE/electron-builder.config.cjs" --mac dmg --arm64 --publish never
      - name: Package Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & .\apps\desktop\node_modules\.bin\electron-builder.cmd --projectDir dist/desktop-stage-ci --config "$env:GITHUB_WORKSPACE\electron-builder.config.cjs" --win dir --publish never
      - name: Verify installed application first run
        shell: bash
        run: |
          mkdir -p dist/ci-reports
          node scripts/smoke-packaged-desktop.cjs 2>&1 | tee dist/ci-reports/desktop-first-run.log
          node scripts/smoke-packaged-desktop.cjs --domains 2>&1 | tee dist/ci-reports/desktop-domains.log
      - name: Verify clean Apple Silicon CAD installation and real native tasks
        if: matrix.platform == 'mac'
        shell: bash
        run: node scripts/smoke-packaged-cad.cjs dist/ci-reports/cad-install --dmg

      - name: Verify workbench UI and language switching
        shell: bash
        run: |
          export INDUSTRIAL_UI_SCREENSHOTS="$GITHUB_WORKSPACE/dist/ci-reports/ui"
          pnpm --filter @industrial-agent-harness/desktop test:ui 2>&1 | tee dist/ci-reports/desktop-ui.log
          pnpm --filter @industrial-agent-harness/desktop test:language 2>&1 | tee dist/ci-reports/desktop-language.log
          pnpm --filter @industrial-agent-harness/desktop test:parallel 2>&1 | tee dist/ci-reports/desktop-parallel.log
          pnpm --filter @industrial-agent-harness/desktop test:gui-settings 2>&1 | tee dist/ci-reports/desktop-gui-settings.log
      - name: Retain installed application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/ci-reports/*.log
            dist/ci-reports/install-experience.log
            dist/ci-reports/ui/
            dist/ci-reports/cad-install/*.log
            dist/ci-reports/cad-install/*.json
            dist/ci-reports/cad-install/*.png
            dist/ci-reports/cad-install/project/
          if-no-files-found: warn
          retention-days: 14
