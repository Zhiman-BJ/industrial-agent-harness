name: Release desktop installers and update feed

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  domain-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Install immutable Pack consumer dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - name: Build immutable owner platform components
        run: node scripts/build-platform-probe.cjs
      - name: Prepare release identity and Pack signing key
        env:
          HARNESS_PACK_PUBLIC_KEYS_JSON_B64: ${{ secrets.HARNESS_PACK_PUBLIC_KEYS_JSON_B64 }}
          HARNESS_PACK_SIGNING_KEY_PEM_B64: ${{ secrets.HARNESS_PACK_SIGNING_KEY_PEM_B64 }}
          HARNESS_PACK_SIGNING_KEY_ID: ${{ vars.HARNESS_PACK_SIGNING_KEY_ID }}
        run: node scripts/desktop-release-env.cjs
      - name: Build signed Domain Pack catalog
        env:
          HARNESS_PACK_PLATFORMS: darwin-arm64,win32-x64
        run: node scripts/build-pack-distribution.cjs dist/domain-packs
      - name: Upload signed Pack files
        uses: actions/upload-artifact@v4
        with:
          name: domain-packs
          path: |
            dist/domain-packs/catalog.json
            dist/domain-packs/*.hpack
          if-no-files-found: error

  mac-arm64-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - name: Build and run native Apple Silicon package
        shell: bash
        run: |
          npm install -g pnpm@11.1.3
          pnpm install --frozen-lockfile
          node scripts/build-platform-probe.cjs
          pnpm --filter @industrial-agent-harness/desktop build
          node scripts/stage-desktop.cjs dist/desktop-stage-arm-smoke
          ./apps/desktop/node_modules/.bin/electron-builder --projectDir dist/desktop-stage-arm-smoke --config "$GITHUB_WORKSPACE/electron-builder.config.cjs" --mac dir --arm64 --publish never
          node scripts/smoke-packaged-desktop.cjs
          node scripts/smoke-packaged-desktop.cjs --domains
          node scripts/smoke-packaged-kimi.cjs
          node scripts/smoke-packaged-cad.cjs dist/ci-reports/cad-release-native

  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            name: mac-arm64
          - runner: windows-2025
            platform: windows
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare release identity and Pack public keys
        env:
          HARNESS_PACK_PUBLIC_KEYS_JSON_B64: ${{ secrets.HARNESS_PACK_PUBLIC_KEYS_JSON_B64 }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
        run: node scripts/desktop-release-env.cjs
      - uses: actions/setup-go@v5
        if: matrix.platform == 'mac'
        with:
          go-version: '1.26.2'
          cache: false
      - name: Install dependencies and test
        shell: bash
        run: |
          npm install -g pnpm@11.1.3
          pnpm install --frozen-lockfile
          if [ "${{ matrix.platform }}" = "mac" ]; then node scripts/build-platform-probe.cjs; fi
          pnpm test:architecture
          pnpm test
          pnpm --filter @industrial-agent-harness/desktop build
      - name: Stage packaged app
        run: node scripts/stage-desktop.cjs dist/desktop-stage-release
      - name: Build signed, notarized macOS DMG and ZIP
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
          ./apps/desktop/node_modules/.bin/electron-builder --projectDir dist/desktop-stage-release --config "$GITHUB_WORKSPACE/electron-builder.config.cjs" --mac dmg zip --arm64 --publish never
      - name: Build signed Windows NSIS installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          & .\apps\desktop\node_modules\.bin\electron-builder.cmd --projectDir dist/desktop-stage-release --config "$env:GITHUB_WORKSPACE\electron-builder.config.cjs" --win nsis --publish never
      - name: Verify signed packaged application first run
        run: |
          node scripts/smoke-packaged-desktop.cjs
          node scripts/smoke-packaged-desktop.cjs --domains
          node scripts/smoke-packaged-kimi.cjs
      - name: Verify signed Apple Silicon CAD installer
        if: matrix.platform == 'mac'
        run: node scripts/smoke-packaged-cad.cjs dist/ci-reports/cad-signed-install --dmg
      - name: Upload install and OTA assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/desktop-release/*.dmg
            dist/desktop-release/*.zip
            dist/desktop-release/*.exe
            dist/desktop-release/*.yml
            dist/desktop-release/*.blockmap
          if-no-files-found: error

  publish-feed:
    needs: [domain-packs, mac-arm64-smoke, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare channel
        env:
          HARNESS_PACK_PUBLIC_KEYS_JSON_B64: ${{ secrets.HARNESS_PACK_PUBLIC_KEYS_JSON_B64 }}
        run: node scripts/desktop-release-env.cjs
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Publish versioned assets and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if test -f "doc/releases/$version.md"; then
              gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Industrial Agent Harness $version" --notes-file "doc/releases/$version.md"
            else
              gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Industrial Agent Harness $version" --generate-notes
            fi
          fi
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber
          tag="desktop-${HARNESS_RELEASE_CHANNEL}-feed"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Desktop ${HARNESS_RELEASE_CHANNEL} update feed" --notes "Signed Desktop and Domain Pack update assets."
          fi
          find release-assets -maxdepth 1 -type f ! -name '*.yml' ! -name 'catalog.json' -print0 | xargs -0 -r gh release upload "$tag" --clobber
          gh release upload "$tag" release-assets/catalog.json --clobber
          find release-assets -maxdepth 1 -type f -name '*.yml' -print0 | xargs -0 -r gh release upload "$tag" --clobber
