name: Release desktop installers and update feed

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  domain-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Install immutable Pack consumer dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare release identity and Pack signing key
        env:
          HARNESS_PACK_PUBLIC_KEYS_JSON_B64: ${{ secrets.HARNESS_PACK_PUBLIC_KEYS_JSON_B64 }}
          HARNESS_PACK_SIGNING_KEY_PEM_B64: ${{ secrets.HARNESS_PACK_SIGNING_KEY_PEM_B64 }}
          HARNESS_PACK_SIGNING_KEY_ID: ${{ vars.HARNESS_PACK_SIGNING_KEY_ID }}
        run: node scripts/desktop-release-env.cjs
      - name: Build signed Domain Pack catalog
        env:
          HARNESS_PACK_PLATFORMS: darwin-arm64,win32-x64
        run: node scripts/build-pack-distribution.cjs dist/domain-packs
      - name: Upload signed Pack files
        uses: actions/upload-artifact@v4
        with:
          name: domain-packs
          path: |
            dist/domain-packs/catalog.json
            dist/domain-packs/*.hpack
          if-no-files-found: error

  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            name: mac-arm64
          - runner: windows-2025
            platform: windows
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    outputs:
      macSigning: ${{ steps.signing.outputs.mac }}
      winSigning: ${{ steps.signing.outputs.win }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare release identity and Pack public keys
        env:
          HARNESS_PACK_PUBLIC_KEYS_JSON_B64: ${{ secrets.HARNESS_PACK_PUBLIC_KEYS_JSON_B64 }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
        run: node scripts/desktop-release-env.cjs
      - name: Record installer signing mode
        id: signing
        shell: bash
        run: |
          key="$(printf '%s' "${{ matrix.platform }}" | cut -c1-3)"
          echo "$key=$HARNESS_DESKTOP_SIGNING" >> "$GITHUB_OUTPUT"
      - name: Install dependencies and test
        shell: bash
        run: |
          npm install -g pnpm@11.1.3
          pnpm install --frozen-lockfile
          # The trusted architecture lane runs on Linux; its candidate-fetch
          # tests fail on windows runners (git nul-device hooksPath quirk).
          if test "${{ matrix.platform }}" = mac; then pnpm test:architecture; fi
          # Release gate covers the Desktop application and the packages it
          # ships (filter with dependency closure). The standalone CLI/SDK
          # product suites stay in main CI - a Desktop release must not be
          # blocked by them.
          pnpm --filter @industrial-agent-harness/desktop... test
          pnpm --filter @industrial-agent-harness/desktop build
      - name: Stage packaged app
        run: node scripts/stage-desktop.cjs dist/desktop-stage-release
      - name: Build macOS DMG and ZIP (signed and notarized when credentials exist)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if test "$HARNESS_DESKTOP_SIGNING" = signed; then
            test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
            ./apps/desktop/node_modules/.bin/electron-builder --projectDir dist/desktop-stage-release --config "$GITHUB_WORKSPACE/electron-builder.config.cjs" --mac dmg zip --arm64 --publish never
          else
            echo "::warning::Apple signing credentials are not configured; building an ad-hoc signed internal installer."
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            ./apps/desktop/node_modules/.bin/electron-builder --projectDir dist/desktop-stage-release --config "$GITHUB_WORKSPACE/electron-builder.config.cjs" --mac dir --arm64 --publish never
            codesign --force --deep --sign - "dist/desktop-release/mac-arm64/Industrial Agent Harness.app"
            codesign --verify --deep --strict "dist/desktop-release/mac-arm64/Industrial Agent Harness.app"
            ./apps/desktop/node_modules/.bin/electron-builder --projectDir dist/desktop-stage-release --config "$GITHUB_WORKSPACE/electron-builder.config.cjs" --mac dmg zip --arm64 --prepackaged "$GITHUB_WORKSPACE/dist/desktop-release/mac-arm64/Industrial Agent Harness.app" --publish never
          fi
      - name: Verify macOS DMG structure and signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          dmg=$(ls dist/desktop-release/*.dmg | head -1)
          echo "Verifying $dmg"
          volume=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's/.*Apple_HFS[[:space:]]*//p' | tail -1)
          if test -z "$volume" || ! test -d "$volume"; then
            echo "::error::Could not locate the mounted volume for $dmg"
            hdiutil attach -nobrowse -readonly "$dmg" 2>&1 || true
            ls -la /Volumes/ || true
            exit 1
          fi
          if ! test -d "$volume/Industrial Agent Harness.app/Contents/MacOS"; then
            echo "::error::DMG bundle layout is broken under $volume"
            find "$volume" -maxdepth 3 -print | head -20
            exit 1
          fi
          codesign --verify --deep --strict "$volume/Industrial Agent Harness.app"
          codesign -dv "$volume/Industrial Agent Harness.app" 2>&1 | grep 'Signature='
          hdiutil detach "$volume" -quiet
          echo "DMG structure and signature verified: $dmg"
      - name: Build Windows NSIS installer (signed when credentials exist)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:HARNESS_DESKTOP_SIGNING -eq 'signed') {
            & .\apps\desktop\node_modules\.bin\electron-builder.cmd --projectDir dist/desktop-stage-release --config "$env:GITHUB_WORKSPACE\electron-builder.config.cjs" --win nsis --publish never
          } else {
            Write-Host "::warning::Windows signing credentials are not configured; building an unsigned internal installer."
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            & .\apps\desktop\node_modules\.bin\electron-builder.cmd --projectDir dist/desktop-stage-release --config "$env:GITHUB_WORKSPACE\electron-builder.config.cjs" --win nsis --publish never
          }
      - name: Verify packaged application first run
        run: |
          node scripts/smoke-packaged-desktop.cjs
          node scripts/smoke-packaged-kimi.cjs
      - name: Upload install and OTA assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/desktop-release/*.dmg
            dist/desktop-release/*.zip
            dist/desktop-release/*.exe
            dist/desktop-release/*.yml
            dist/desktop-release/*.blockmap
          if-no-files-found: error

  publish-feed:
    needs: [domain-packs, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare channel
        env:
          HARNESS_PACK_PUBLIC_KEYS_JSON_B64: ${{ secrets.HARNESS_PACK_PUBLIC_KEYS_JSON_B64 }}
        run: node scripts/desktop-release-env.cjs
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Publish versioned assets and update metadata
        env:
          # The job token gets 403 on release creation under the current org
          # workflow-permission policy; the CD token already owns releases
          # in both repositories.
          GH_TOKEN: ${{ secrets.PACK_BUMP_PAT }}
          MAC_SIGNING: ${{ needs.installers.outputs.macSigning }}
          WIN_SIGNING: ${{ needs.installers.outputs.winSigning }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          title="Industrial Agent Harness $version"
          signed=true
          if test "$MAC_SIGNING" != signed || test "$WIN_SIGNING" != signed; then
            signed=false
            title="$title (unsigned internal build)"
          fi
          notes="doc/releases/$version.md"
          if ! test -f "$notes"; then notes=""; fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            prerelease=false
            if test "$signed" = false; then prerelease=true; fi
            if test -n "$notes"; then
              gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --prerelease="$prerelease" --title "$title" --notes-file "$notes"
            else
              gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --prerelease="$prerelease" --title "$title" --generate-notes
            fi
          fi
          if test "$signed" = false && test -f "$notes"; then
            printf '\n> ⚠️ 未签名内测构建：签名凭据未配置。macOS 包带 ad-hoc 签名，首次打开可在「系统设置 → 隐私与安全性」选择「仍要打开」（或用 curl 命令行下载，完全无弹窗）；本版无应用内自动更新。\n' >> "$notes"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber
          if test "$signed" = false; then
            echo "Skipping the update feed for an unsigned build; Core OTA requires signed installers."
            exit 0
          fi
          tag="desktop-${HARNESS_RELEASE_CHANNEL}-feed"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Desktop ${HARNESS_RELEASE_CHANNEL} update feed" --notes "Signed Desktop and Domain Pack update assets."
          fi
          find release-assets -maxdepth 1 -type f ! -name '*.yml' ! -name 'catalog.json' -print0 | xargs -0 -r gh release upload "$tag" --clobber
          gh release upload "$tag" release-assets/catalog.json --clobber
          find release-assets -maxdepth 1 -type f -name '*.yml' -print0 | xargs -0 -r gh release upload "$tag" --clobber
