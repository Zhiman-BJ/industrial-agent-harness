packages:
  - apps/*
  - packages/*
# Deployment checks must not trigger an implicit production-only reinstall of
# the development workspace. CI installs the frozen lockfile explicitly.
verifyDepsBeforeRun: false
allowBuilds:
  '@moonshot-ai/kimi-code': true
  electron-winstaller: false
  node-pty: true

# Immutable Pack URL is supplied explicitly by each application; never fetch an implicit npm peer.
autoInstallPeers: false
